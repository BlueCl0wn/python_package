[project]
name = "myutils"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "BlueCl0wn", email = "---" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5",
    "pint>=0.26.2",
    "scipy>=1.18.1",
    "sympy>=1.14.0",
    "uncertainties>=3.2.3",
]

[build-system]
requires = ["uv_build>=0.11.23,<0.12.0"]
build-backend = "uv_build"

[tool.ruff.lint.per-file-ignores]
"src/myutils/envs/sympy.py" = ["F403", "F405"]
"src/myutils/envs/optics.py" = ["F403", "F405"]
"src/myutils/envs/science.py" = ["F403", "F405"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
